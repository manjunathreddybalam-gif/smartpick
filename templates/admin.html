<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage products — SmartPick</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="admin-body">
  <header class="topbar"><a class="brand" href="/"><span class="brand-mark">S</span> SmartPick<span class="dot">.</span></a><nav><a href="/">← View website</a></nav></header>
  <main class="admin-main">
    <div class="eyebrow">LOCAL PRODUCT MANAGER</div><h1>Manage your collection.</h1>
    <p class="admin-warning">Development version: this page has no login. Keep it on your own laptop. Do not deploy it publicly until authentication and security protections are added.</p>
    <div id="admin-message" class="admin-message hidden"></div>
    <form id="product-form" class="admin-form">
      <input type="hidden" id="product-id">
      <div class="form-heading"><h2 id="form-title">Add a product</h2><button type="button" id="reset-form" class="text-btn">Clear form</button></div>
      <div class="form-grid">
        <label>Product name *<input id="name" required maxlength="120" placeholder="e.g. Wireless Headphones"></label>
        <label>Category *<input id="category" required maxlength="60" placeholder="e.g. Electronics"></label>
        <label>Price (₹) *<input id="price" type="number" min="0" step="0.01" required value="0"></label>
        <label>Rating (0–5)<input id="rating" type="number" min="0" max="5" step="0.1" value="4"></label>
        <label class="full">Short description<textarea id="description" rows="2" placeholder="What makes this product useful?"></textarea></label>
        <label class="full">Features (separate with semicolons)<input id="features" placeholder="Lightweight; Durable; Easy to use"></label>
        <label class="full">Image URL<input id="image_url" type="url" placeholder="https://…"></label>
        <label class="full">Affiliate / product URL<input id="affiliate_url" type="url" placeholder="https://…"></label>
        <label class="full">Small label<input id="tag" maxlength="60" placeholder="e.g. Budget pick"></label>
      </div>
      <button class="primary-btn" type="submit" id="save-btn">Save product <span>↗</span></button>
    </form>
    <section class="admin-list-section"><div class="form-heading"><h2>Your products</h2><span id="admin-count" class="count-pill">0 products</span></div><div id="admin-list" class="admin-list"></div></section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
